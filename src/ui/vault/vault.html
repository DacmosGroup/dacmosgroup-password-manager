<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vault — DacmosGroup Password Manager</title>
  <link rel="stylesheet" href="vault.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🔐</span>
      <div class="logo-text">
        <span class="logo-title">DacmosGroup</span>
        <span class="logo-subtitle">Mi Vault</span>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" id="btnNuevaCredencial">
      + Nueva
    </button>
  </header>

  <!-- Barra de búsqueda -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Buscar credenciales..."
      autocomplete="off"
    />
  </div>

  <!-- Lista de credenciales -->
  <main class="vault-content">

    <!-- Estado: vacío -->
    <div class="empty-state hidden" id="emptyState">
      <span class="empty-icon">🗄️</span>
      <h3>Tu vault está vacío</h3>
      <p>Agrega tu primera credencial para comenzar</p>
      <button class="btn btn-primary" id="btnAgregarPrimero">
        + Agregar credencial
      </button>
    </div>

    <!-- Lista de credenciales -->
    <ul class="credential-list" id="credentialList">
      <!-- Se llena dinámicamente con JS -->
    </ul>

  </main>

  <!-- Modal: Agregar / Editar credencial -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Nueva Credencial</h3>
        <button class="btn-close" id="btnCerrarModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Sitio / Servicio</label>
          <input type="text" id="inputSitio" class="input" placeholder="ej. Gmail, Netflix, GitHub"/>
        </div>
        <div class="form-group">
          <label class="form-label">URL (opcional)</label>
          <input type="url" id="inputUrl" class="input" placeholder="https://ejemplo.com"/>
        </div>
        <div class="form-group">
          <label class="form-label">Usuario / Email</label>
          <input type="text" id="inputUsuario" class="input" placeholder="tu@email.com" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <input type="password" id="inputPassword" class="input" placeholder="Contraseña" autocomplete="off"/>
            <button class="btn-icon" id="btnTogglePass">👁</button>
            <button class="btn-icon" id="btnGenerarPass" title="Generar contraseña segura">⚡</button>
          </div>
          <!-- Indicador de fortaleza -->
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Notas (opcional)</label>
          <textarea id="inputNotas" class="input textarea" placeholder="Notas adicionales..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>DacmosGroup.com · Zero-Knowledge · AES-256-GCM</span>
  </footer>

  <script src="vault.js"></script>
</body>
</html>
