<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault — Dacmos Password Manager</title>
  <link rel="stylesheet" href="vault.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🔐</span>
      <div class="logo-text">
        <span class="logo-title">DacmosGroup</span>
        <span class="logo-subtitle" data-i18n="vault.header_subtitle">Vault</span>
      </div>
    </div>
    <button class="btn btn-inicio" id="btnInicio" data-i18n="common.back">← Inicio</button>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm hidden" id="btnHealth" data-i18n="vault.btn_health">🛡 Health</button>
      <button class="btn btn-primary btn-sm hidden" id="btnNuevaCredencial" data-i18n="vault.btn_new">+ Nueva</button>
    </div>
  </header>

  <!-- Vista: Desbloquear vault -->
  <div class="unlock-overlay" id="unlockOverlay">
    <div class="unlock-card">
      <span class="unlock-icon">🔒</span>
      <h2 data-i18n="auth.unlock.title_vault">Vault Bloqueado</h2>
      <p data-i18n="auth.unlock.desc_vault">Ingresa tu contraseña maestra para acceder</p>
      <div class="input-group">
        <input
          type="password"
          id="unlockInput"
          class="input"
          data-i18n-placeholder="auth.unlock.placeholder"
          placeholder="Contraseña maestra"
          autocomplete="off"
        />
        <button class="btn-icon" id="btnToggleUnlock" data-i18n-aria="common.aria_toggle_pass">👁</button>
      </div>
      <p class="error-msg hidden" id="unlockError" data-i18n="auth.unlock.error_incorrect">Contraseña incorrecta</p>
      <button class="btn btn-primary" id="btnDesbloquear" data-i18n="auth.unlock.btn_vault">
        Desbloquear Vault
      </button>
    </div>
  </div>

  <!-- Vista: Vault desbloqueado -->
  <div class="vault-wrapper hidden" id="vaultWrapper">

    <!-- Barra de búsqueda -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        data-i18n-placeholder="vault.search_placeholder"
        placeholder="Buscar credenciales..."
        autocomplete="off"
      />
      <span class="credential-counter" id="credentialCounter"></span>
    </div>

    <!-- Contenido principal -->
    <main class="vault-content">

      <!-- Estado vacío -->
      <div class="empty-state hidden" id="emptyState">
        <span class="empty-icon">🗄️</span>
        <h3 data-i18n="vault.empty_title">Tu vault está vacío</h3>
        <p data-i18n="vault.empty_desc">Agrega tu primera credencial para comenzar</p>
        <button class="btn btn-primary" id="btnAgregarPrimero" data-i18n="vault.empty_btn">
          + Agregar credencial
        </button>
      </div>

      <!-- Lista de credenciales -->
      <ul class="credential-list" id="credentialList"></ul>

    </main>
  </div>

  <!-- Modal: Agregar / Editar -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" data-i18n="vault.modal_title_new">Nueva Credencial</h3>
        <button class="btn-close" id="btnCerrarModal">✕</button>
      </div>

      <!-- Selector de tipo -->
      <div class="type-selector" id="typeSelector">
        <button class="type-tab active" data-tipo="login" data-i18n="vault.modal_type_login">🔐 Login</button>
        <button class="type-tab" data-tipo="tarjeta" data-i18n="vault.modal_type_card">💳 Tarjeta</button>
        <button class="type-tab" data-tipo="identidad" data-i18n="vault.modal_type_identity">👤 Identidad</button>
      </div>

      <div class="modal-body">
        <!-- El formulario se inyecta aquí dinámicamente según el tipo -->
        <div id="formContainer"></div>
        <p class="error-msg hidden" id="modalError"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelar" data-i18n="common.cancel">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar" data-i18n="vault.modal_btn_save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span data-i18n="vault.footer">DacmosGroup.co · Zero-Knowledge · AES-256-GCM</span>
  </footer>

  <script src="vault.js" type="module"></script>
</body>
</html>
