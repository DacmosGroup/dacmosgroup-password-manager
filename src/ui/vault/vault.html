<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vault — Dacmos Password Manager</title>
  <link rel="stylesheet" href="vault.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🔐</span>
      <div class="logo-text">
        <span class="logo-title">DacmosGroup</span>
        <span class="logo-subtitle">Mi Vault</span>
      </div>
    </div>
    <button class="btn btn-inicio" id="btnInicio">← Inicio</button>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm hidden" id="btnHealth">🛡 Health</button>
      <button class="btn btn-primary btn-sm hidden" id="btnNuevaCredencial">+ Nueva</button>
    </div>
  </header>

  <!-- Vista: Desbloquear vault -->
  <div class="unlock-overlay" id="unlockOverlay">
    <div class="unlock-card">
      <span class="unlock-icon">🔒</span>
      <h2>Vault Bloqueado</h2>
      <p>Ingresa tu contraseña maestra para acceder</p>
      <div class="input-group">
        <input
          type="password"
          id="unlockInput"
          class="input"
          placeholder="Contraseña maestra"
          autocomplete="off"
        />
        <button class="btn-icon" id="btnToggleUnlock">👁</button>
      </div>
      <p class="error-msg hidden" id="unlockError">Contraseña incorrecta</p>
      <button class="btn btn-primary" id="btnDesbloquear">
        Desbloquear Vault
      </button>
    </div>
  </div>

  <!-- Vista: Vault desbloqueado -->
  <div class="vault-wrapper hidden" id="vaultWrapper">

    <!-- Barra de búsqueda -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Buscar credenciales..."
        autocomplete="off"
      />
      <span class="credential-counter" id="credentialCounter"></span>
    </div>

    <!-- Contenido principal -->
    <main class="vault-content">

      <!-- Estado vacío -->
      <div class="empty-state hidden" id="emptyState">
        <span class="empty-icon">🗄️</span>
        <h3>Tu vault está vacío</h3>
        <p>Agrega tu primera credencial para comenzar</p>
        <button class="btn btn-primary" id="btnAgregarPrimero">
          + Agregar credencial
        </button>
      </div>

      <!-- Lista de credenciales -->
      <ul class="credential-list" id="credentialList"></ul>

    </main>
  </div>

  <!-- Modal: Agregar / Editar -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Nueva Credencial</h3>
        <button class="btn-close" id="btnCerrarModal">✕</button>
      </div>

      <!-- Selector de tipo -->
      <div class="type-selector" id="typeSelector">
        <button class="type-tab active" data-tipo="login">🔐 Login</button>
        <button class="type-tab" data-tipo="tarjeta">💳 Tarjeta</button>
        <button class="type-tab" data-tipo="identidad">👤 Identidad</button>
      </div>

      <div class="modal-body">
        <!-- El formulario se inyecta aquí dinámicamente según el tipo -->
        <div id="formContainer"></div>
        <p class="error-msg hidden" id="modalError"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>DacmosGroup.com · Zero-Knowledge · AES-256-GCM</span>
  </footer>

  <script src="vault.js" type="module"></script>
</body>
</html>
