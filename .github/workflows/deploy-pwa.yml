# deploy-pwa.yml — Pipeline de despliegue de la PWA a Cloudflare Pages
#
# Disparo automático:
#   - Push a main que incluya cambios dentro de web/**
# Disparo manual:
#   - workflow_dispatch desde GitHub Actions → Run workflow
#     (desde main = producción; desde otra rama = preview de Cloudflare Pages)
#
# Secretos requeridos (configurar en GitHub → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  → Cloudflare Dashboard → My Profile → API Tokens
#                           Crear token con permiso: Cloudflare Pages — Edit
#   CLOUDFLARE_ACCOUNT_ID → Cloudflare Dashboard → lado derecho → Account ID
#
# El directorio desplegado es web/ — solo la carpeta de la PWA,
# no la extensión Chrome ni ningún otro archivo del repositorio.

name: Deploy PWA → Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      # Disparar cuando cambian archivos de la PWA o el propio workflow (2026-05-31)
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:
    # Permite ejecutar el deploy manualmente desde la UI de GitHub Actions

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read      # Leer el código del repositorio
      deployments: write  # Crear registros de despliegue en GitHub

    steps:
      # ── Paso 1: Obtener el código fuente ──────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      # ── Paso 1b: Verificar Workbox vendorizado (SW-1, §32) ────────────
      # El SW importa Workbox 7.0.0 desde web/libs/workbox-v7.0.0/.
      # importScripts() no admite SRI, así que la integridad se comprueba
      # aquí: si algún archivo no coincide con SHA256SUMS, el job falla y
      # no hay deploy. --strict también falla ante líneas mal formadas.
      - name: Verificar hashes de Workbox vendorizado
        working-directory: web/libs/workbox-v7.0.0
        run: sha256sum -c --strict SHA256SUMS

      # ── Paso 1c: Verificar MSAL vendorizado (SC-1, §32) ───────────────
      # Solo compara hashes, sin npm: la recompilación desde el registro
      # vive en verify-vendored.yml para no ampliar la cadena de suministro
      # del deploy. Si el archivo cambia, el job falla y no hay deploy.
      - name: Verificar hash de MSAL vendorizado
        working-directory: web/libs
        run: sha256sum -c --strict SHA256SUMS

      # ── Paso 2: Inyectar SW_DEPLOY_ID con el commit SHA ──────────────
      # Reemplaza el valor 'dev' de SW_DEPLOY_ID en service-worker.js con
      # los primeros 7 caracteres del commit SHA actual. Esto garantiza que
      # cada deploy genera nombres de caché únicos, forzando la invalidación
      # de assets obsoletos en todos los navegadores de los usuarios.
      - name: Inyectar SW_DEPLOY_ID con commit SHA
        run: |
          DEPLOY_ID="${GITHUB_SHA:0:7}"
          sed -i "s/const SW_DEPLOY_ID = 'dev'/const SW_DEPLOY_ID = '${DEPLOY_ID}'/" web/service-worker.js
          echo "SW_DEPLOY_ID inyectado: ${DEPLOY_ID}"

      # ── Paso 3: Desplegar web/ a Cloudflare Pages ─────────────────────
      # cloudflare/wrangler-action@v4 (Node.js 24) reemplaza pages-action@v1
      # (pages-action quedó abandonado en Node.js 16 sin actualización).
      # El comando `pages deploy` es el equivalente directo de pages-action:
      #   - Sube el contenido de web/ a Cloudflare Pages
      #   - Registra el despliegue en GitHub (visible en Deployments)
      #   - Publica preview URLs en PRs si el branch no es main
      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          # Token de API de Cloudflare (con permiso Cloudflare Pages: Edit)
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ID de la cuenta de Cloudflare
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Comando wrangler: despliega web/ al proyecto dacmos-pm-pwa con la rama
          # que disparó el job. En main (push o dispatch) es el deploy de producción;
          # un workflow_dispatch desde otra rama crea un preview en
          # <rama-saneada>.dacmos-pm-pwa.pages.dev y nunca toca producción.
          # Antes era --branch=main fijo: un dispatch desde cualquier rama
          # publicaba en producción (gate SW-1, 2026-11-26).
          # El origen del preview NO se registra en los OAuth de Google ni de
          # Microsoft: el sync no funciona en previews, a propósito.
          command: pages deploy web --project-name=dacmos-pm-pwa --branch=${{ github.ref_name }}
          # Token de GitHub para registrar el despliegue en la UI de GitHub
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
