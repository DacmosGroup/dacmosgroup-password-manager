# deploy-pwa.yml — Pipeline de despliegue de la PWA a Cloudflare Pages
#
# Disparo automático:
#   - Push a main que incluya cambios dentro de web/**
# Disparo manual:
#   - workflow_dispatch desde GitHub Actions → Run workflow
#
# Secretos requeridos (configurar en GitHub → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  → Cloudflare Dashboard → My Profile → API Tokens
#                           Crear token con permiso: Cloudflare Pages — Edit
#   CLOUDFLARE_ACCOUNT_ID → Cloudflare Dashboard → lado derecho → Account ID
#
# El directorio desplegado es web/ — solo la carpeta de la PWA,
# no la extensión Chrome ni ningún otro archivo del repositorio.

name: Deploy PWA → Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      # Disparar cuando cambian archivos de la PWA o el propio workflow
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:
    # Permite ejecutar el deploy manualmente desde la UI de GitHub Actions

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read      # Leer el código del repositorio
      deployments: write  # Crear registros de despliegue en GitHub

    steps:
      # ── Paso 1: Obtener el código fuente ──────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      # ── Paso 2: Desplegar web/ a Cloudflare Pages ─────────────────────
      # cloudflare/wrangler-action@v4 (Node.js 24) reemplaza pages-action@v1
      # (pages-action quedó abandonado en Node.js 16 sin actualización).
      # El comando `pages deploy` es el equivalente directo de pages-action:
      #   - Sube el contenido de web/ a Cloudflare Pages
      #   - Registra el despliegue en GitHub (visible en Deployments)
      #   - Publica preview URLs en PRs si el branch no es main
      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          # Token de API de Cloudflare (con permiso Cloudflare Pages: Edit)
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ID de la cuenta de Cloudflare
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Comando wrangler: despliega web/ al proyecto dacmos-pm-pwa en main
          command: pages deploy web --project-name=dacmos-pm-pwa --branch=main
          # Token de GitHub para registrar el despliegue en la UI de GitHub
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
