<!--
  icon-maskable.svg — Ícono maskable 512×512 (placeholder)
  Propósito: "maskable" — Android aplica una máscara (círculo, cuadrado,
  squircle, etc.) sobre este ícono al mostrarlo en el launcher.

  Regla de safe zone:
    El sistema puede recortar hasta el 20% de cada lado.
    → Todo el contenido visual DEBE estar dentro del área central del 60%:
      x: [102, 410] | y: [102, 410] en un canvas de 512×512

  El fondo sólido ocupa TODO el canvas (sin transparencia) para que
  la máscara del launcher siempre muestre el color de marca.

  Paleta: --color-bg #1a1a2e | --color-primary #0066cc | --color-accent #00d4ff
  PRODUCCIÓN: reemplazar por PNG 512×512 maskable generado desde los assets finales
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512">

  <!-- Fondo sólido de canvas completo — OBLIGATORIO para maskable -->
  <rect width="512" height="512" fill="#1a1a2e"/>

  <!-- ─── Contenido dentro de la safe zone [102, 102, 410, 410] ─────── -->

  <!-- Cuerpo del candado — centrado, dentro de safe zone -->
  <rect x="168" y="280" width="176" height="130" rx="24" fill="#0066cc"/>

  <!-- Ojo del candado -->
  <circle cx="256" cy="345" r="20" fill="#1a1a2e"/>

  <!-- Arco del candado — el extremo superior no supera y=140 (safe zone) -->
  <path d="M200 280V230a56 56 0 0 1 112 0v50"
        stroke="#00d4ff"
        stroke-width="20"
        stroke-linecap="round"
        fill="none"/>

</svg>
