apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Leer credenciales de firma desde local.properties — nunca hardcodeadas en el repo.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withReader('UTF-8') { reader -> localProps.load(reader) }
}

// AAB-1 (Sprint 3, §32): el AAB de Play se firma con la clave de SUBIDA (`dacmos-upload`);
// el APK de GitHub Releases sigue firmado con `dacmos-pm`, que Google tiene como clave de
// firma de la app (PEPK). Para que un olvido no firme el AAB con `dacmos-pm` (casi
// irreversible en Play), el build se niega a seguir en vez de caer a un valor por defecto:
//   AAB:  ./gradlew bundleRelease -Pdpm.signing=upload
//   APK:  ./gradlew assembleRelease          (sin la propiedad)
def dpmSigning = (project.findProperty('dpm.signing') ?: '').toString()
def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last().toLowerCase() }
def isReleaseTask = { String t, String prefix -> t.startsWith(prefix) && !t.contains('debug') }
def bundleRequested   = requestedTasks.any { isReleaseTask(it, 'bundle') }
def assembleRequested = requestedTasks.any { isReleaseTask(it, 'assemble') }
if (dpmSigning && dpmSigning != 'upload') {
    throw new GradleException("dpm.signing='${dpmSigning}' no es valido: el unico valor admitido es 'upload'.")
}
if (bundleRequested && dpmSigning != 'upload') {
    throw new GradleException('AAB de release sin -Pdpm.signing=upload: el AAB de Play se firma con la clave de subida, nunca con dacmos-pm (documento-tecnico, seccion 32).')
}
if (assembleRequested && dpmSigning == 'upload') {
    throw new GradleException('-Pdpm.signing=upload solo vale para el AAB (bundleRelease): el APK de GitHub se firma con dacmos-pm.')
}
if (dpmSigning == 'upload' && !localProps['UPLOAD_KEYSTORE_PATH']) {
    throw new GradleException('Falta UPLOAD_KEYSTORE_PATH (y UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD) en local.properties.')
}

android {
    namespace = "co.dacmosgroup.dpm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.dacmosgroup.dpm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.6.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile     file(localProps['KEYSTORE_PATH'] ?: '')
            storePassword localProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias      localProps['KEY_ALIAS']         ?: ''
            keyPassword   localProps['KEY_PASSWORD']      ?: ''
        }
        // Solo se define al pedir el AAB: sin la propiedad, el build no depende del keystore de subida.
        if (dpmSigning == 'upload') {
            upload {
                storeFile     file(localProps['UPLOAD_KEYSTORE_PATH'])
                storePassword localProps['UPLOAD_KEYSTORE_PASSWORD'] ?: ''
                keyAlias      localProps['UPLOAD_KEY_ALIAS']         ?: ''
                keyPassword   localProps['UPLOAD_KEY_PASSWORD']      ?: ''
            }
        }
    }
    buildTypes {
        release {
            signingConfig dpmSigning == 'upload' ? signingConfigs.upload : signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
